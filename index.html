<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070c">
  <meta name="description" content="Learn system design by doomscrolling: memes, diagrams and quizzes.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DoomScholar">
  <title>DoomScholar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="feed">
  <div class="shell">
    <header class="topbar">
      <div class="brand">Doom<span>Scholar</span></div>
      <div class="hstats"><span id="streak">🔥 0</span><span id="xp">⚡ 0</span></div>
      <div id="progress" class="progress"></div>
    </header>

    <main>
      <section id="view-feed" class="view feed" aria-label="Feed"></section>
      <section id="view-topics" class="view page" aria-label="Topics" hidden></section>
      <section id="view-quiz" class="view page" aria-label="Quiz" hidden></section>
      <section id="view-saved" class="view saved" aria-label="Saved" hidden></section>
      <section id="view-interview" class="view page iv-page" aria-label="Mock interview" hidden></section>
    </main>

    <nav class="tabbar">
      <a href="#/feed" data-tab="feed"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span>Feed</span></a>
      <a href="#/topics" data-tab="topics"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg><span>Topics</span></a>
      <a href="#/quiz" data-tab="quiz"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>Quiz</span></a>
      <a href="#/saved" data-tab="saved"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>Saved</span></a>
    </nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal" hidden></div>

  <script src="js/storage.js"></script>
  <script src="js/diagram.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/interview.js"></script>
  <script src="content/registry.js"></script>
  <script src="content/manifest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
